name: Refresh report

on:
  # Triggered every 15 minutes by the Scheduler workflow, on push, or by hand.
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build report from CRM
        run: python3 build/report.py
        env:
          FRAPPE_TOKEN: ${{ secrets.FRAPPE_TOKEN }}
          CENTRAL_REPS: ${{ secrets.CENTRAL_REPS }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
